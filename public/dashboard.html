<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FireGuard – Building Dashboard</title>
    <style>
      /* simplified styles (kept visual parity with original) */
      :root {
        --bg: #0b0f14;
        --panel: #111823;
        --muted: #1a2432;
        --accent: #2e90fa;
        --ok: #22c55e;
        --warn: #f59e0b;
        --alarm: #ef4444;
        --fault: #8b5cf6;
        --text: #e5eefb;
        --sub: #95a3b9;
        --chip: #0f1723;
        --card: #0d1320;
        --radius: 16px;
        --shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: linear-gradient(180deg, #0a0f16, #0b1522 60%, #0b0f14);
        color: var(--text);
        font: 14px/1.6 system-ui, Segoe UI, Roboto, Helvetica, Arial;
      }
      .container {
        max-width: 1280px;
        margin: 0 auto;
        padding: 20px;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 16px;
        justify-content: space-between;
        margin-bottom: 18px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: radial-gradient(
          circle at 30% 30%,
          #2e90fa,
          #0ea5e9 60%,
          #0b1322 61%
        );
        box-shadow: var(--shadow);
      }
      .building-chip {
        background: var(--chip);
        border: 1px solid #1e2a3a;
        color: #c9d7ef;
        padding: 6px 10px;
        border-radius: 999px;
        font-weight: 600;
      }
      .toolbar {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .select,
      .input {
        appearance: none;
        background: #0e1726;
        border: 1px solid #1e2a3a;
        color: #dbe7ff;
        padding: 10px 12px;
        border-radius: 10px;
        min-width: 160px;
      }
      .btn {
        background: var(--accent);
        border: none;
        color: white;
        border-radius: 10px;
        padding: 10px 14px;
        font-weight: 700;
        cursor: pointer;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin: 16px 0;
      }
      .kpi {
        background: var(--card);
        border: 1px solid #182235;
        border-radius: var(--radius);
        padding: 16px;
        box-shadow: var(--shadow);
      }
      .kpi h3 {
        margin: 0 0 6px 0;
        font-size: 12px;
        color: var(--sub);
        text-transform: uppercase;
      }
      .kpi .val {
        font-size: 26px;
        font-weight: 800;
      }
      .grid {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 16px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid #1a2435;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .panel h2 {
        margin: 0;
        padding: 14px 16px;
        border-bottom: 1px solid #1f2a3d;
        background: linear-gradient(180deg, #111b2a, #0e1623);
        font-size: 14px;
        color: #b6c6e0;
        text-transform: uppercase;
      }
      .panel .content {
        padding: 16px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 10px 8px;
        text-align: left;
        border-bottom: 1px solid #1f2a3d;
      }
      th {
        color: #a8b6cf;
        text-transform: uppercase;
        font-size: 12px;
      }
      .badge {
        padding: 6px 10px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 12px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .b-ok {
        background: rgba(34, 197, 94, 0.12);
        color: #9ae6b4;
      }
      .b-warn {
        background: rgba(245, 158, 11, 0.12);
        color: #f7d48b;
      }
      .b-alarm {
        background: rgba(239, 68, 68, 0.14);
        color: #fecaca;
      }
      .b-fault {
        background: rgba(139, 92, 246, 0.14);
        color: #d9cafe;
      }
      .events {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .event {
        background: #0c1422;
        border: 1px solid #1a2435;
        border-radius: 12px;
        padding: 10px;
      }
      /* Toast notifications */
      .toasts {
        position: fixed;
        top: 16px;
        right: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 9999;
        pointer-events: none;
      }
      .toast {
        pointer-events: auto;
        min-width: 280px;
        max-width: 420px;
        background: #0c1422;
        border: 1px solid #1a2435;
        border-left: 6px solid var(--accent);
        color: #eaf2ff;
        border-radius: 12px;
        box-shadow: var(--shadow);
        padding: 12px 14px;
        animation: slideIn 0.2s ease-out;
        cursor: pointer;
      }
      .toast h4 {
        margin: 0 0 6px 0;
        font-size: 14px;
      }
      .toast .msg {
        color: #b9c9e6;
        font-size: 13px;
      }
      .toast .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .toast .btn-ack {
        background: transparent;
        color: #cfe1ff;
        border: 1px solid #28415f;
        padding: 6px 10px;
        border-radius: 8px;
        cursor: pointer;
      }
      .toast.warn {
        border-left-color: var(--warn);
      }
      .toast.alarm {
        border-left-color: var(--alarm);
      }
      .toast.ok {
        border-left-color: var(--ok);
      }
      @keyframes slideIn {
        from {
          transform: translateY(-10px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      .muted {
        color: #9fb0ca;
      }
      @media (max-width: 1024px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .kpis {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="brand">
          <div class="logo" aria-hidden="true"></div>
          <div>
            <h1>FireGuard — Building Dashboard</h1>
            <div class="muted" id="buildingLabel">
              Building: <strong>Aurora Tower</strong>
            </div>
          </div>
        </div>
        <span class="building-chip" id="chip">Single‑Building Mode</span>
      </div>

      <div class="toolbar">
        <select class="select" id="floorSelect"></select>
        <input
          class="input"
          id="searchZone"
          placeholder="Search zone or sensor…"
        />
        <select class="select" id="kpiScope">
          <option value="building">KPIs: Building</option>
          <option value="floor">KPIs: Current floor</option>
        </select>
        <button class="btn" id="openMap">View on Map</button>
        <span id="liveStatus" class="muted" style="margin-left: auto"
          >Live: connecting… · Updated: —</span
        >
      </div>

      <div class="kpis" id="kpis">
        <div class="kpi">
          <h3>Total Sensors</h3>
          <div class="val" id="kpiSensors">—</div>
        </div>
        <div class="kpi">
          <h3>Normal</h3>
          <div class="val ok" id="kpiNormal">—</div>
        </div>
        <div class="kpi">
          <h3>Warnings</h3>
          <div class="val warn" id="kpiWarn">—</div>
        </div>
        <div class="kpi">
          <h3>Alarms</h3>
          <div class="val alarm" id="kpiAlarm">—</div>
        </div>
      </div>

      <div class="grid">
        <section class="panel">
          <h2>Zones & Live Status</h2>
          <div class="content">
            <table id="zonesTbl">
              <thead>
                <tr>
                  <th style="width: 120px">Zone</th>
                  <th>Floor</th>
                  <th>Sensors</th>
                  <th>Status</th>
                  <th>Last Event</th>
                  <th style="width: 160px">Actions</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </section>

        <aside class="panel">
          <h2>Recent Events</h2>
          <div class="content"><div class="events" id="events"></div></div>
        </aside>
      </div>

      <div class="actions" style="margin-top: 12px">
        <button class="btn ghost" id="ackBtn">Acknowledge</button>
        <button class="btn ghost" id="silenceBtn">Silence 120s</button>
        <button class="btn ghost" id="resetBtn">Reset</button>
      </div>
    </div>

    <!-- Toast container -->
    <div id="toasts" class="toasts"></div>

    <script>
      // API base: trỏ thẳng về BE để file chạy cả khi mở bằng file://
      const API = "http://localhost:8090";
      window.FIREGUARD_API_BASE = API;

      const floorSelect = document.getElementById("floorSelect");
      const zonesTbody = document.querySelector("#zonesTbl tbody");
      const eventsBox = document.getElementById("events");

      let ZONES = [];
      let EVENTS = [];
      let KPI_SCOPE = "building"; // 'building' | 'floor'
      let STREAM_CONNECTED = false;
      let STREAM_READY = false; // skip notifications on first SSE payload
      let PREV_ALARM_ZONES = new Set();
      let PREV_EVENT_IDS = new Set();
      let LAST_OVERVIEW_AT = 0; // ms
      // Live indexes for instant state updates from SSE
      const SENSOR_TO_ZONE = new Map(); // sensor_id -> { zone_id, floor }
      const ZONE_TO_SENSORS = new Map(); // zone_id -> Set(sensor_id)
      const LATEST_BY_SENSOR = new Map(); // sensor_id -> latest reading
      // UI override to avoid flicker: when a reading crosses threshold, we set
      // a temporary Alarm state for that zone without immediately clearing it
      // unless stability is observed or overview confirms.
      const ZONE_OVERRIDE = new Map(); // zone_id -> 'Alarm'
      const ZONE_COOLDOWN = new Map(); // zone_id -> consecutive-normal counter

      function idOfEvent(e) {
        return (
          e.id ||
          e.event_id ||
          `${e.zone_id || "z"}-${e.suspected_at || e.created_at || e.ts || ""}`
        );
      }

      function pushToast(title, msg, level = "warn", goTo) {
        const box = document.getElementById("toasts");
        const div = document.createElement("div");
        div.className = `toast ${level}`;
        div.innerHTML = `<div class="row"><h4>${title}</h4><button class="btn-ack">Acknowledge</button></div><div class="msg">${msg}</div>`;
        const ack = div.querySelector(".btn-ack");
        ack.onclick = (e) => {
          e.stopPropagation();
          div.remove();
        };
        // Navigate to the sensor's floor/zone when clicking the toast
        div.onclick = () => {
          try {
            if (goTo && goTo.floor) {
              floorSelect.value = goTo.floor;
              renderTable();
              history.replaceState({}, "", `?floor=${goTo.floor}`);
            }
            if (goTo && goTo.openMap) {
              location.href = `sensor-map.html?floor=${encodeURIComponent(
                goTo.floor || ""
              )}&zone=${encodeURIComponent(goTo.zone_id || "")}`;
            }
          } catch {}
        };
        box.appendChild(div);
        setTimeout(() => div.remove(), 12000);
        if (level === "alarm") {
          try {
            const ctx = new (window.AudioContext ||
              window.webkitAudioContext)();
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = "sine";
            o.frequency.value = 880;
            o.connect(g);
            g.connect(ctx.destination);
            g.gain.setValueAtTime(0.001, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.05);
            o.start();
            setTimeout(() => {
              g.gain.exponentialRampToValueAtTime(
                0.0001,
                ctx.currentTime + 0.25
              );
              o.stop(ctx.currentTime + 0.3);
              ctx.close();
            }, 260);
          } catch {}
        }
      }

      function setPrevFromData(events, alarms) {
        PREV_EVENT_IDS = new Set((events || []).map(idOfEvent));
        PREV_ALARM_ZONES = new Set((alarms || []).map((a) => a.zone_id));
      }

      function checkTransitionsWithStream(data) {
        const events = Array.isArray(data.active_events)
          ? data.active_events
          : [];
        const alarms = Array.isArray(data.active_alarms)
          ? data.active_alarms
          : [];
        const nowAlarmZones = new Set(alarms.map((a) => a.zone_id));
        for (const zid of nowAlarmZones) {
          if (!PREV_ALARM_ZONES.has(zid)) {
            const z = ZONES.find((x) => x.zone_id === zid);
            pushToast(
              `ALARM — ${z?.zone_name || zid}`,
              `Floor ${z?.floor || ""}: Active alarm triggered`,
              "alarm",
              { floor: z?.floor || "", zone_id: zid }
            );
          }
        }
        PREV_ALARM_ZONES = nowAlarmZones;
        for (const e of events) {
          const key = idOfEvent(e);
          const sev = Number(e.severity) || 0;
          if (!PREV_EVENT_IDS.has(key) && sev >= 1 && sev <= 3) {
            pushToast(
              `Warning — ${e.zone_name || ""}`,
              `${e.summary || e.message || ""} (S${sev})`,
              "warn",
              { floor: e.floor || "", zone_id: e.zone_id || e.zoneid }
            );
          }
        }
        PREV_EVENT_IDS = new Set(events.map(idOfEvent));
      }

      function fmtTime(ts) {
        if (!ts) return "—";
        return new Date(ts).toLocaleString();
      }

      function badge(state) {
        const map = {
          Normal: "b-ok",
          Warning: "b-warn",
          Alarm: "b-alarm",
          Fault: "b-fault",
        };
        return `<span class="badge ${map[state] || ""}">${state}</span>`;
      }

      // Threshold classification using raw readings (mirrors map page)
      function computeStateByReading(r) {
        if (!r) return "Normal";
        if (
          (r.smoke_ppm != null && Number(r.smoke_ppm) > 70) ||
          (r.temp_c != null && Number(r.temp_c) > 60) ||
          (r.co2_ppm != null && Number(r.co2_ppm) > 1200)
        ) {
          return "Alarm";
        }
        return "Normal";
      }

      function fmtReading(r) {
        if (!r) return "(không có dữ liệu)";
        const parts = [];
        if (r.smoke_ppm != null) parts.push(`Khói ${Number(r.smoke_ppm)}ppm`);
        if (r.temp_c != null) parts.push(`Nhiệt ${Number(r.temp_c)}°C`);
        if (r.co2_ppm != null) parts.push(`CO₂ ${Number(r.co2_ppm)}ppm`);
        return parts.join(", ");
      }

      function alarmCauses(r) {
        if (!r) return [];
        const causes = [];
        if (r.smoke_ppm != null && Number(r.smoke_ppm) > 70)
          causes.push(`Khói ${Number(r.smoke_ppm)}ppm (>70)`);
        if (r.temp_c != null && Number(r.temp_c) > 60)
          causes.push(`Nhiệt ${Number(r.temp_c)}°C (>60)`);
        if (r.co2_ppm != null && Number(r.co2_ppm) > 1200)
          causes.push(`CO₂ ${Number(r.co2_ppm)}ppm (>1200)`);
        return causes;
      }

      // Build sensor→zone index once so we can update zones instantly from SSE
      async function loadSensorIndex() {
        try {
          const res = await fetch(
            window.FIREGUARD_API_BASE + "/api/map/sensors"
          );
          if (!res.ok) throw new Error("fetch sensors failed");
          const sensors = await res.json();
          sensors.forEach((s) => {
            const sid = s.sensor_id || s.id;
            const zid = s.zone_id || s.zone || s.zoneid || s.zone_uuid;
            const floor = String(s.floor || s.floor_name || "");
            if (sid && zid) {
              const label = s.serial_number || sid;
              const stype = s.type || "";
              SENSOR_TO_ZONE.set(sid, {
                zone_id: zid,
                floor,
                label,
                type: stype,
              });
              if (!ZONE_TO_SENSORS.has(zid))
                ZONE_TO_SENSORS.set(zid, new Set());
              ZONE_TO_SENSORS.get(zid).add(sid);
            }
          });
        } catch (e) {
          console.warn("loadSensorIndex", e);
        }
      }

      // Recompute derived_state for affected zones based on latest readings
      function recomputeZonesFromLatest(affectedZoneIds) {
        if (!affectedZoneIds || affectedZoneIds.size === 0) return;
        for (const zid of affectedZoneIds) {
          const sensorSet = ZONE_TO_SENSORS.get(zid);
          if (!sensorSet) continue;
          let state = "Normal";
          for (const sid of sensorSet) {
            const r = LATEST_BY_SENSOR.get(sid);
            const rs = computeStateByReading(r);
            if (rs === "Alarm") {
              state = "Alarm";
              break;
            }
          }
          const z = ZONES.find((x) => (x.zone_id || x.id) === zid);
          if (z) z.derived_state = state;
        }
      }

      function computeState(zone) {
        const zid = zone.zone_id || zone.id;
        // 1) Hard override to avoid flicker during edge transitions
        if (zid && ZONE_OVERRIDE.has(zid)) return ZONE_OVERRIDE.get(zid);
        // 2) Live compute from latest readings if we have them
        if (zid && ZONE_TO_SENSORS.has(zid)) {
          const sensorSet = ZONE_TO_SENSORS.get(zid);
          for (const sid of sensorSet) {
            const r = LATEST_BY_SENSOR.get(sid);
            if (computeStateByReading(r) === "Alarm") return "Alarm";
          }
          // If we had any sensor for this zone and none are alarming, treat as Normal
          if (sensorSet.size > 0) return "Normal";
        }
        // 3) Fallback to backend-derived state if provided
        if (zone.derived_state) return zone.derived_state;
        // 4) Last resort: use active_alarms count
        if ((Number(zone.active_alarms) || 0) > 0) return "Alarm";
        return "Normal";
      }

      function renderKpis() {
        // KPI hiển thị toàn toà nhà hoặc theo tầng đang chọn
        const all =
          KPI_SCOPE === "floor"
            ? ZONES.filter((z) => z.floor === floorSelect.value)
            : ZONES;
        const totalSensors = all.reduce((a, r) => {
          const act = Number(r.active_sensors) || 0;
          const ina = Number(r.inactive_sensors) || 0;
          return a + act + ina;
        }, 0);
        // Derive KPIs from current UI state (overrides + derived_state)
        const zoneStates = all.map((z) => computeState(z));
        const zonesAlarm = zoneStates.filter((s) => s === "Alarm").length;
        const normalZones = zoneStates.filter((s) => s === "Normal").length;
        // Warnings: đếm các event đang active có mức độ 1..3
        const warningZones = (EVENTS || []).filter((e) => {
          const sev = Number(e.severity) || 0;
          const floorOk =
            KPI_SCOPE === "floor" ? e.floor === floorSelect.value : true;
          return floorOk && sev >= 1 && sev <= 3;
        }).length;

        document.getElementById("kpiSensors").textContent = totalSensors;
        document.getElementById("kpiNormal").textContent = normalZones;
        document.getElementById("kpiWarn").textContent = warningZones;
        document.getElementById("kpiAlarm").textContent = zonesAlarm;
      }

      function renderTable() {
        const q = document.getElementById("searchZone").value.toLowerCase();
        const f = floorSelect.value;
        const rows = ZONES.filter(
          (z) =>
            (f ? z.floor === f : true) &&
            (q ? (z.zone_name || "").toLowerCase().includes(q) : true)
        );
        zonesTbody.innerHTML = rows
          .map(
            (z) => `
      <tr>
        <td>
          <strong>${z.zone_name || z.code || z.zone_id || "—"}</strong>
          <div class="muted">${z.zone_id || ""}</div>
        </td>
        <td>${z.floor || ""}</td>
        <td>${(z.active_sensors || 0) + (z.inactive_sensors || 0)}</td>
        <td>${badge(computeState(z))}</td>
  <td class="muted">${fmtTime(z.last_reading_ts || z.last_seen_any)}</td>
        <td>
       <a class="btn" style="padding:6px 10px"
         href="sensor-map.html?floor=${encodeURIComponent(
           z.floor || ""
         )}&zone=${encodeURIComponent(z.zone_id || "")}">
            View on Map
          </a>
        </td>
      </tr>`
          )
          .join("");
        renderKpis();
      }

      function renderEvents() {
        eventsBox.innerHTML =
          EVENTS.map((e) => {
            const zoneName =
              (ZONES.find((z) => z.zone_id === e.zone_id) || {}).zone_name ||
              e.zone_name ||
              "—";
            const ts = e.suspected_at || e.created_at || e.ts || null;
            const sev = e.severity || 1;
            return `
        <div class="event">
          <div class="top">
            <div>
              <strong>${zoneName}</strong>
              · <span class="muted">${e.floor || ""}</span>
            </div>
            <div class="sev sev-${sev}">S${sev}</div>
          </div>
          <div class="muted">${fmtTime(ts)}</div>
          <div>${e.summary || e.message || e.msg || ""}</div>
        </div>`;
          }).join("") || '<div class="muted">No active events.</div>';
      }

      async function loadOverview() {
        try {
          const r = await fetch(
            window.FIREGUARD_API_BASE + "/api/dashboard/overview"
          );
          if (!r.ok) throw new Error("Fetch failed " + r.status);
          const data = await r.json();

          // Chuẩn hoá ZONES
          ZONES = (data.zoneHealth || []).map((z) => ({
            ...z,
            zone_id: z.zone_id || z.id,
            zone_name: z.zone_name || z.name,
            // ép kiểu số để tránh cộng chuỗi
            active_sensors: Number(z.active_sensors) || 0,
            inactive_sensors: Number(z.inactive_sensors) || 0,
            active_alarms: Number(z.active_alarms) || 0,
          }));
          EVENTS = data.activeEvents || [];

          // Prime latest readings map if backend provided them
          if (Array.isArray(data.latestReadings)) {
            data.latestReadings.forEach((r) => {
              if (r && r.sensor_id) LATEST_BY_SENSOR.set(r.sensor_id, r);
            });
          }

          // If overview already shows Alarm, clear any redundant overrides
          const alarmSet = new Set(
            ZONES.filter((z) => (z.derived_state || "") === "Alarm").map(
              (z) => z.zone_id || z.id
            )
          );
          for (const zid of alarmSet) ZONE_OVERRIDE.delete(zid);

          // Populate floor dropdown
          const floors = Array.from(
            new Set(ZONES.map((z) => z.floor).filter(Boolean))
          );
          floorSelect.innerHTML = "";
          floors.forEach((f) => {
            const o = document.createElement("option");
            o.value = f;
            o.textContent = `Floor ${f}`;
            floorSelect.appendChild(o);
          });

          // Lấy floor từ URL nếu có
          const url = new URLSearchParams(location.search);
          const qFloor = url.get("floor");
          if (qFloor && floors.includes(qFloor)) floorSelect.value = qFloor;
          else if (!floorSelect.value && floors[0])
            floorSelect.value = floors[0];

          renderTable();
          renderEvents();

          // Nếu SSE chưa kết nối, dùng polling để phát hiện thay đổi và notify
          if (!STREAM_CONNECTED) {
            const nowAlarmZones = new Set(
              ZONES.filter((z) => (Number(z.active_alarms) || 0) > 0).map(
                (z) => z.zone_id
              )
            );
            for (const zid of nowAlarmZones) {
              if (!PREV_ALARM_ZONES.has(zid)) {
                const z = ZONES.find((x) => x.zone_id === zid);
                pushToast(
                  `ALARM — ${z?.zone_name || zid}`,
                  `Floor ${z?.floor || ""}: Active alarm triggered`,
                  "alarm"
                );
              }
            }
            PREV_ALARM_ZONES = nowAlarmZones;
            const nowEventIds = new Set((EVENTS || []).map(idOfEvent));
            for (const e of EVENTS) {
              const sev = Number(e.severity) || 0;
              const key = idOfEvent(e);
              if (!PREV_EVENT_IDS.has(key) && sev >= 1 && sev <= 3) {
                pushToast(
                  `Warning — ${e.zone_name || ""}`,
                  `${e.summary || e.message || ""} (S${sev})`,
                  "warn"
                );
              }
            }
            PREV_EVENT_IDS = nowEventIds;
          } else if (!STREAM_READY) {
            // Khởi tạo snapshot để không spam ngay lần đầu
            setPrevFromData(EVENTS, []);
          }

          // Cập nhật “last updated” KPI (nếu phần tử tồn tại)
          const upd = document.getElementById("kpiUpdated");
          if (upd) upd.textContent = new Date().toLocaleTimeString();

          // Update live label when relying on polling (e.g., no SSE)
          const live = document.getElementById("liveStatus");
          if (live && !STREAM_CONNECTED) {
            live.textContent = `Live: polling · Updated: ${new Date().toLocaleTimeString()}`;
          }

          LAST_OVERVIEW_AT = Date.now();
        } catch (e) {
          console.error("loadOverview", e);
        }
      }

      function startStream() {
        try {
          const es = new EventSource(
            window.FIREGUARD_API_BASE + "/api/dashboard/stream"
          );
          const live = document.getElementById("liveStatus");
          if (live) live.textContent = "Live: connecting… · Updated: —";

          es.onopen = () => {
            STREAM_CONNECTED = true;
            live && (live.textContent = "Live: connected · Updated: —");
          };
          es.onerror = (e) => {
            console.warn("SSE error", e);
            STREAM_CONNECTED = false;
            live &&
              (live.textContent = "Live: error (auto-retry) · Updated: —");
          };
          es.onmessage = (ev) => {
            try {
              const d = JSON.parse(ev.data);
              if (Array.isArray(d.active_events)) {
                EVENTS = d.active_events;
                renderEvents();
              }
              // Edge-triggered alerts from latest readings without flipping UI back and forth
              const latest = Array.isArray(d.latest)
                ? d.latest
                : Array.isArray(d.latest_readings)
                ? d.latest_readings
                : null;
              let changedOverride = false;
              if (latest) {
                latest.forEach((l) => {
                  if (!l || !l.sensor_id) return;
                  const prev = LATEST_BY_SENSOR.get(l.sensor_id);
                  const prevState = computeStateByReading(prev);
                  const newState = computeStateByReading(l);
                  LATEST_BY_SENSOR.set(l.sensor_id, l);
                  const m = SENSOR_TO_ZONE.get(l.sensor_id);
                  if (!m || !m.zone_id) return;
                  const zid = m.zone_id;
                  if (newState === "Alarm" && prevState !== "Alarm") {
                    // Set override and toast once
                    if (!ZONE_OVERRIDE.has(zid)) {
                      ZONE_OVERRIDE.set(zid, "Alarm");
                      changedOverride = true;
                      const z = ZONES.find((x) => (x.zone_id || x.id) === zid);
                      const causes = alarmCauses(l).join(", ");
                      const sensorMeta = SENSOR_TO_ZONE.get(l.sensor_id) || {};
                      pushToast(
                        `ALARM — ${z?.zone_name || zid}`,
                        `${sensorMeta.label || l.sensor_id} · Tầng ${
                          z?.floor || ""
                        } · Vượt ngưỡng: ${causes || fmtReading(l)}`,
                        "alarm",
                        { floor: z?.floor || "", zone_id: zid }
                      );
                    }
                    ZONE_COOLDOWN.set(zid, 0);
                  } else if (newState === "Normal" && prevState === "Alarm") {
                    // Trở về bình thường: bỏ override ngay và thông báo màu xanh
                    ZONE_OVERRIDE.delete(zid);
                    ZONE_COOLDOWN.delete(zid);
                    changedOverride = true;
                    const z = ZONES.find((x) => (x.zone_id || x.id) === zid);
                    const sensorMeta = SENSOR_TO_ZONE.get(l.sensor_id) || {};
                    pushToast(
                      `NORMAL — ${z?.zone_name || zid}`,
                      `${sensorMeta.label || l.sensor_id} · Tầng ${
                        z?.floor || ""
                      } · Giá trị hiện tại: ${fmtReading(l)}`,
                      "ok",
                      { floor: z?.floor || "", zone_id: zid }
                    );
                  }
                });
              }

              if (!STREAM_READY) {
                setPrevFromData(d.active_events, d.active_alarms);
                STREAM_READY = true;
              } else {
                checkTransitionsWithStream(d);
              }
              // cập nhật nhãn thời gian để người dùng thấy SSE đang hoạt động
              if (live) {
                const ts = new Date().toLocaleTimeString();
                live.textContent = `Live: connected · Updated: ${ts}`;
              }
              // Refresh overview (debounced) so KPIs and derived states stay current
              if (Date.now() - LAST_OVERVIEW_AT > 5000) {
                loadOverview();
              }

              if (changedOverride) {
                renderTable();
              }
            } catch (err) {
              console.error("sse parse", err);
            }
          };
        } catch (e) {
          console.warn("SSE not available", e);
        }
      }

      // Events
      document
        .getElementById("searchZone")
        .addEventListener("input", renderTable);
      floorSelect.addEventListener("change", () => {
        renderTable();
        history.replaceState({}, "", `?floor=${floorSelect.value}`);
      });
      document.getElementById("kpiScope").addEventListener("change", (e) => {
        KPI_SCOPE = e.target.value;
        renderKpis();
      });
      document.getElementById("openMap").addEventListener("click", () => {
        // Open local map file so it works from file:// as well
        location.href = `sensor-map.html?floor=${encodeURIComponent(
          floorSelect.value
        )}`;
      });

      // Demo buttons (chưa có API action)
      document.getElementById("ackBtn").onclick = () =>
        alert("ACK sent — demo");
      document.getElementById("silenceBtn").onclick = () =>
        alert("Silenced for 120s — demo");
      document.getElementById("resetBtn").onclick = () =>
        alert("Reset signal sent — demo");

      // Run
      // Build sensor index first to enable instant SSE-based updates
      loadSensorIndex().then(() => {
        loadOverview();
        startStream();
      });
      // Light polling as a safety net in case SSE doesn't fire changes
      setInterval(loadOverview, 10000);
    </script>
  </body>
</html>
